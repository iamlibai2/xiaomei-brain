appId: com.xiaomei.brain.desktop
productName: xiaomei-brain
npmRebuild: false
msiProjectCreated: scripts/patch-msi-project.cjs
directories:
  output: release
files:
  - dist/**/*
  - package.json
asarUnpack:
  - node_modules/node-pty/**/*
extraResources:
  - from: runtime-stage/package
    to: runtime-package
    filter:
      - "**/*"
win:
  target: msi
  icon: assets/icon.png
  artifactName: "xiaomei-brain-${version}-setup.${ext}"
  signAndEditExecutable: false
msi:
  oneClick: true
  perMachine: false
  additionalLightArgs:
    - -sval
mac:
  target: dmg
  icon: assets/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: "小美仅在你主动点击语音输入时使用麦克风。"
    NSCameraUsageDescription: "小美仅在你主动点击拍照时使用摄像头。"
linux:
  target: AppImage
  icon: assets/icon.png
