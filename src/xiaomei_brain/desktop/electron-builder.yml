appId: com.xiaomei.brain.desktop
productName: XiaoMei-Brain
npmRebuild: false
publish:
  provider: github
  owner: iamlibai2
  repo: xiaomei-brain
  releaseType: release
directories:
  output: release
files:
  - dist/**/*
  - package.json
  # PDF.js uses this optional native canvas package only in Node. The Desktop
  # renderer ships its browser worker and must not add ~38 MB of unused binaries.
  - "!node_modules/@napi-rs/canvas*/**/*"
asarUnpack:
  - node_modules/node-pty/**/*
  # The Agent executes the official Go binary directly. It must remain outside
  # app.asar; no system Node/npm installation is required at runtime.
  - node_modules/@larksuite/cli/bin/**/*
extraResources:
  - from: assets/icon.png
    to: assets/icon.png
  - from: runtime-stage/package
    to: runtime-package
    filter:
      - "**/*"
  - from: ai-runtime-requirements.txt
    to: setup/ai-runtime-requirements.txt
  - from: optional-ai-services.json
    to: setup/optional-ai-services.json
win:
  target: nsis
  icon: assets/icon.png
  artifactName: "xiaomei-brain-${version}-setup.${ext}"
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  uninstallDisplayName: "${productName}"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
mac:
  target: dmg
  icon: assets/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: "小美仅在你主动点击语音输入时使用麦克风。"
    NSCameraUsageDescription: "小美仅在你主动点击拍照时使用摄像头。"
linux:
  target: AppImage
  icon: assets/icon.png
