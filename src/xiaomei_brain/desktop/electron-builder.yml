appId: com.xiaomei.brain.desktop
productName: xiaomei-brain
npmRebuild: false
msiProjectCreated: scripts/patch-msi-project.cjs
directories:
  output: release
files:
  - dist/**/*
  - package.json
  # PDF.js uses this optional native canvas package only in Node. The Desktop
  # renderer ships its browser worker and must not add ~38 MB of unused binaries.
  - "!node_modules/@napi-rs/canvas*/**/*"
asarUnpack:
  - node_modules/node-pty/**/*
  # The Agent executes the official Go binary directly. It must remain outside
  # app.asar; no system Node/npm installation is required at runtime.
  - node_modules/@larksuite/cli/bin/**/*
extraResources:
  - from: runtime-stage/package
    to: runtime-package
    filter:
      - "**/*"
win:
  target: msi
  icon: assets/icon.png
  artifactName: "xiaomei-brain-${version}-setup.${ext}"
  signAndEditExecutable: false
msi:
  oneClick: true
  perMachine: false
  additionalLightArgs:
    - -sval
mac:
  target: dmg
  icon: assets/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: "小美仅在你主动点击语音输入时使用麦克风。"
    NSCameraUsageDescription: "小美仅在你主动点击拍照时使用摄像头。"
linux:
  target: AppImage
  icon: assets/icon.png
