name: dingtalk
version: "1.0.0"
description: 钉钉机器人对接 — Stream 长连接接收消息，sessionWebhook 回复
kind: channel
channel: dingtalk
configSchema:
  type: object
  additionalProperties: false
  properties:
    clientId:
      type: string
      description: 钉钉应用 Client ID（推荐）
    clientSecret:
      type: string
      description: 钉钉应用 Client Secret（推荐）
    accountId:
      type: string
      description: 当前 Agent 绑定的钉钉账号配置标识
    displayName:
      type: string
      description: Desktop 中展示的机器人名称
    appKey:
      type: string
      description: 钉钉应用 AppKey（旧命名，兼容）
    appSecret:
      type: string
      description: 钉钉应用 AppSecret（旧命名，兼容）
